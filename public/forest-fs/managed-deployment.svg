<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#495057"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#adb5bd"/>
    </marker>
  </defs>

  <rect width="780" height="310" fill="#ffffff" rx="8"/>

  <!-- Workspace column label -->
  <text x="20" y="22" font-size="11" fill="#adb5bd" letter-spacing="0.3">Slack workspaces</text>

  <!-- Workspace A -->
  <rect x="20" y="32" width="130" height="55" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/>
  <text x="85" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">Workspace A</text>
  <text x="85" y="74" text-anchor="middle" font-size="11" fill="#555">acme-corp.slack.com</text>

  <!-- Workspace B -->
  <rect x="20" y="125" width="130" height="55" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/>
  <text x="85" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">Workspace B</text>
  <text x="85" y="167" text-anchor="middle" font-size="11" fill="#555">startup.slack.com</text>

  <!-- Workspace C -->
  <rect x="20" y="218" width="130" height="55" rx="8" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/>
  <text x="85" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">Workspace C</text>
  <text x="85" y="260" text-anchor="middle" font-size="11" fill="#555">other-team.slack.com</text>

  <!-- Fan-in arrows (OAuth install) -->
  <line x1="150" y1="59"  x2="262" y2="152" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="150" y1="152" x2="262" y2="152" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="150" y1="245" x2="262" y2="152" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="192" y="143" text-anchor="middle" font-size="11" fill="#adb5bd" font-style="italic">OAuth install</text>

  <!-- Managed infrastructure boundary -->
  <rect x="238" y="28" width="352" height="265" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="256" y="48" font-size="11" fill="#adb5bd" letter-spacing="0.3">managed infrastructure</text>

  <!-- FastAPI box -->
  <rect x="262" y="124" width="155" height="56" rx="8" fill="#d0ebff" stroke="#339af0" stroke-width="1.5"/>
  <text x="339" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">FastAPI</text>
  <text x="339" y="167" text-anchor="middle" font-size="11" fill="#555">shared server</text>

  <!-- FastAPI → PostgreSQL -->
  <line x1="339" y1="180" x2="339" y2="212" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PostgreSQL + pgvector -->
  <rect x="262" y="212" width="300" height="62" rx="8" fill="#c3fae8" stroke="#0ca678" stroke-width="1.5"/>
  <text x="412" y="237" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">PostgreSQL + pgvector</text>
  <text x="412" y="255" text-anchor="middle" font-size="11" fill="#555">isolated per workspace_id</text>

  <!-- FastAPI → LLM API (exits boundary) -->
  <line x1="417" y1="152" x2="616" y2="152" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="518" y="144" text-anchor="middle" font-size="11" fill="#adb5bd">chat · embed</text>

  <!-- LLM API (external) -->
  <rect x="616" y="124" width="148" height="56" rx="8" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="690" y="149" text-anchor="middle" font-size="13" font-weight="600" fill="#1e1e1e">LLM API</text>
  <text x="690" y="167" text-anchor="middle" font-size="11" fill="#555">OpenRouter / OpenAI</text>
</svg>
